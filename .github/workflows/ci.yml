name: CI

on:
  push:
    branches: ["main"]                           # run on every push to main
  pull_request:
    branches: ["main"]                           # run on PRs targeting main

jobs:

  # Job 1: Lint
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest                       # standard GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4                # check out source
      - uses: actions/setup-python@v5            # provision Python
        with:
          python-version: "3.11"                 # match Dockerfile base image version
      - run: pip install ruff==0.15.12           # install pinned linter only — no full requirements needed
      - run: ruff check .                        # lint all Python files (respects .gitignore; skips venv/)

  # Job 2: Test
  test:
    name: pytest
    runs-on: ubuntu-latest                       # standard runner
    needs: lint                                  # skip tests if lint fails
    steps:
      - uses: actions/checkout@v4                # check out source
      - uses: actions/setup-python@v5            # provision Python
        with:
          python-version: "3.11"                 # consistent Python version across all jobs
      - run: pip install -r requirements.txt     # install all pinned project dependencies
      - run: python -m models.train --city seoul  # train Seoul model; saves artifacts to models/artifacts/seoul/
      - run: pytest tests/                       # run full test suite

  # Job 3: Docker Build
  docker:
    name: Docker build
    runs-on: ubuntu-latest                       # standard runner
    needs: test                                  # only build image if tests pass
    steps:
      - uses: actions/checkout@v4                # check out source
      - run: docker build -t bike-demand-ml-system:ci .  # build image; trains all 4 city models during build

  # Job 4: Publish to GitHub Container Registry (GHCR)
  # runs only on push to main (not on pull requests)
  # uses GITHUB_TOKEN — no manual secrets required
  publish:
    name: Push to GHCR
    runs-on: ubuntu-latest                       # standard runner
    needs: docker                                # only publish if docker build passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read                             # read repo source
      packages: write                            # push image to GHCR
    steps:
      - uses: actions/checkout@v4                # check out source
      - uses: docker/login-action@v3             # authenticate with GHCR using auto-injected token
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5        # build and push in a single step
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bike-demand-ml-system:latest
            ghcr.io/${{ github.repository_owner }}/bike-demand-ml-system:${{ github.sha }}
