# GCP project configuration for the bike demand streaming pipeline
project_id: bike-demand-ml-system      # GCP project ID — used for all API calls and resource scoping
region: us-central1                    # GCP region — matches Cloud Run and Artifact Registry deployment

# ── Pub/Sub settings ──────────────────────────────────────────
pubsub:
  topic: gbfs-bike-stations            # Pub/Sub topic name where GBFS station snapshots are published
  subscription: gbfs-bike-stations-sub # Pub/Sub subscription consumed by the Dataflow pipeline

# ── BigQuery settings ─────────────────────────────────────────
bigquery:
  dataset: bike_demand                 # BigQuery dataset that holds all bike demand tables
  table: station_snapshots             # BigQuery table receiving 5-minute windowed station aggregations

# ── Dataflow job settings ─────────────────────────────────────
dataflow:
  staging_bucket: gs://bike-demand-staging/temp  # GCS path for Dataflow job staging and temp files
  max_num_workers: 1                             # cap at 1 worker to minimise cost during demo runs
  machine_type: e2-medium                        # e2-medium (4 GB RAM): enough for Python streaming harness overhead
  zone: us-central1-f                            # pin to us-central1-f to avoid zone stockout errors
  window_seconds: 300                           # FixedWindow size in seconds (5 minutes)

# ── GBFS polling settings ─────────────────────────────────────
gbfs:
  poll_interval_seconds: 60            # seconds to sleep between each full poll cycle across all cities
  cities:
    nyc:                               # Citi Bike New York
      name: New York                   # human-readable city name (used in structured logs)
      url: "https://gbfs.citibikenyc.com/gbfs/en/station_status.json"  # GBFS v2 station_status endpoint
    dc:                                # Capital Bikeshare Washington DC
      name: Washington DC              # human-readable city name
      url: "https://gbfs.capitalbikeshare.com/gbfs/en/station_status.json"  # GBFS v2 station_status endpoint
    london:                            # TfL Santander Cycles London (non-standard GBFS format)
      name: London                     # human-readable city name
      url: "https://api.tfl.gov.uk/BikePoint"  # TfL BikePoint API endpoint (all docking stations)
      adapter: tfl                     # flag to select TFL-specific parsing logic instead of standard GBFS
    chicago:                           # Divvy Bikes Chicago
      name: Chicago                    # human-readable city name
      url: "https://gbfs.divvybikes.com/gbfs/en/station_status.json"  # GBFS v2 station_status endpoint

# ── Vertex AI training job settings ──────────────────────────
vertex_ai:
  # ⚠️  COST GUARD — DO NOT REMOVE.
  # At n1-highmem-2 rates (~$0.091/hr), 1800s caps exposure at $0.046 per run.
  # Without this, a hung container accrues cost indefinitely with no auto-stop.
  # Note: e2-standard-2 is not supported by Vertex AI; n1-highmem-2 is the cheapest supported 2-vCPU type.
  job_timeout_seconds: 1800
  machine_type: "n1-highmem-2"        # cheapest Vertex AI-supported 2-vCPU machine (13.75 GB RAM)
  replica_count: 1                    # single worker — no distributed training needed
  staging_bucket: "gs://bike-demand-staging"  # GCS bucket for Vertex AI staging artifacts
  container_image_uri: "us-central1-docker.pkg.dev/bike-demand-ml-system/bike-demand-repo/bike-demand-training:latest"  # GAR training image
  region: "us-central1"              # matches existing Cloud Run / GAR deployment region

# ── MLflow experiment tracking settings ──────────────────────
mlflow:
  # GCS-backed tracking — no server required. Browse locally with:
  # mlflow ui --backend-store-uri gs://bike-demand-staging/mlflow
  tracking_uri: "gs://bike-demand-staging/mlflow"  # GCS-backed MLflow store (free, no server)
  experiment_prefix: "bike-demand"   # → experiments named "bike-demand-seoul", "bike-demand-london" etc.

# ── Automated retraining config ───────────────────────────────
retraining:
  # Minimum RMSE reduction required to promote a model from Staging to Production.
  # 3% is above the RF noise floor (~1-2%) — represents genuine improvement, not random variation.
  # Do not lower below 0.97 — risks promoting noise as signal.
  rmse_improvement_threshold: 0.97
  cities:
    - name: "seoul"                   # city identifier — matches artifact directory name
      data_path: "data/raw/seoul/seoul_bike_sharing.csv"  # UCI Seoul Bike Sharing dataset
    - name: "london"                  # city identifier
      data_path: "data/processed/london_bike_sharing.csv"  # Kaggle london_merged.csv (prepared)
    - name: "nyc"                     # city identifier
      data_path: "data/processed/nyc_bike_sharing.csv"   # BigQuery + Open-Meteo join (prepared)
    - name: "dc"                      # city identifier
      data_path: "data/processed/dc_bike_sharing.csv"    # Capital Bikeshare + Open-Meteo join (prepared)
  param_grid:
    n_estimators: [100, 200, 300]     # tree count options — 6 combos total (3 × 2)
    max_features: ["sqrt", "log2"]    # feature sampling strategies — sqrt≈7 features, log2≈5 features
