version: "3.9"                                               # Compose file format version

services:

  # FastAPI Prediction Service
  fastapi:                                                   # service name referenced by dependent stacks
    build:
      context: .                                             # build from project root
      dockerfile: Dockerfile                                 # explicit Dockerfile path
    ports:
      - "8000:8000"                                          # expose API on host port 8000
    environment:
      - USE_PUBSUB=false                                     # disable Pub/Sub integration in local dev
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"
      interval: 30s                                          # probe every 30 seconds
      timeout: 5s                                            # fail if no response within 5 seconds
      retries: 3                                             # mark container unhealthy after 3 consecutive failures
